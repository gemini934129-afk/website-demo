name: Auto Update Website

on:
  push:
    branches: [ main ]
  schedule:
    # 每小時自動更新
    - cron: '0 * * * *'
  workflow_dispatch:

# 只保留推送股價資料所需的權限。
# Pages 的發佈交给 GitHub 內建的 branch build（來源：main / root），
# 本 workflow 不再自己部署，避免兩條部署路徑互相搶同一個 github-pages 環境。
permissions:
  contents: write

# 同一時間只允許一個更新在跑，避免同時 push 造成衝突
concurrency:
  group: "auto-update"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance

    - name: Update stock prices
      run: python update_stocks.py

    - name: Commit stock data changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add stock_data.json
        git diff --staged --quiet || git commit -m "Auto-update stock prices: $(date -u +'%Y-%m-%d %H:%M UTC')"
        git push || echo "No changes to push"
